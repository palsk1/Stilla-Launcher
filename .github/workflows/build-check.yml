# Builds Stilla on every pull request, without uploading anything, so a broken
# change shows up as a red cross on the PR before it reaches master.
name: Build check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: bash ./gradlew :engine:test

      - name: Build the app
        run: bash ./gradlew :app:assembleDebug
