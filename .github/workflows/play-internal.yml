# Builds Stilla and uploads it to Google Play internal testing on every push to master,
# except pushes that only change Markdown files (guides, README, HANDOVER).
# Can also be started by hand: Actions → "Play internal testing" → Run workflow.
#
# Secrets (Settings → Secrets and variables → Actions), see HANDOVER.md:
#   STILLA_UPLOAD_KEYSTORE_BASE64  upload-key.jks as base64
#   STILLA_KEYSTORE_PASSWORD       storePassword from keystore.properties
#   STILLA_KEY_ALIAS               keyAlias from keystore.properties
#   STILLA_KEY_PASSWORD            keyPassword from keystore.properties
#   PLAY_SERVICE_ACCOUNT_JSON      the whole play-service-account.json
name: Play internal testing

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# One upload at a time; a newer push waits instead of racing for the same version code.
concurrency:
  group: play-internal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the secrets are set
        env:
          KEYSTORE_B64: ${{ secrets.STILLA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.STILLA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STILLA_KEY_ALIAS }}
          KEY_PW: ${{ secrets.STILLA_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in KEYSTORE_B64 STORE_PW KEY_ALIAS KEY_PW PLAY_JSON; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is missing"; missing=1; fi
          done
          exit $missing

      - name: Restore the upload key
        env:
          KEYSTORE_B64: ${{ secrets.STILLA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          # Tolerates line breaks and spaces around the pasted value.
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          echo "STILLA_KEYSTORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

      - name: Engine tests
        run: ./gradlew :engine:test

      - name: Build and upload to internal testing
        env:
          STILLA_KEYSTORE_PASSWORD: ${{ secrets.STILLA_KEYSTORE_PASSWORD }}
          STILLA_KEY_ALIAS: ${{ secrets.STILLA_KEY_ALIAS }}
          STILLA_KEY_PASSWORD: ${{ secrets.STILLA_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew :app:publishReleaseBundle

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
